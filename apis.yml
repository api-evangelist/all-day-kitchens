name: All Day Kitchens
description: >-
  All Day Kitchens is a San Francisco-based cloud-kitchen (ghost kitchen)
  infrastructure company that operates a network of delivery-optimized
  commissary kitchens, letting restaurant brands expand into new markets and
  fulfill online delivery orders without building out their own physical
  locations. Often positioned as a "Kitchen as a Service" platform, it pairs
  shared kitchen capacity with software and operations for order routing, food
  preparation, and last-mile delivery hand-off. The company was added to the
  API Evangelist network as an a16z portfolio lead; as of this enrichment pass
  it publishes only a marketing landing page at www.alldaykitchens.com with no
  public developer portal, API, documentation, or event surface.
